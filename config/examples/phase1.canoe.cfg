# EXPERIMENTAL - NOT VALIDATED ON HARDWARE
version 1
generation 1
boot-manager-menu phase1
menu-mode menu
key-window 1200
menu-timeout 5
show-booting yes
fastbootd-mode2 yes
default android-a
mode 1
devinfo-repair asneeded

entry android-a
  title Android Slot A
  image boot_a.efi
  mode 1
  role other

entry android-b
  title Android Slot B
  image boot_b.efi
  mode 1
  role other
